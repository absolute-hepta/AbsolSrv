name: NatePlugin
version: 1.0.0
main: com.nateplugin.NatePlugin
api-version: 1.20
author: Xautral
description: IA Nate - Admin artificial con personalidad curiosa, tímida y amable, desarrollado por Xautral.

commands:
  nate:
    description: Comandos para controlar a Nate
    usage: /nate <on|off|apikey|status|model|banlist|pardon|suggest>
    permission: nate.use
  chat:
    description: Habla en privado con Nate
    usage: /chat <mensaje>
    permission: nate.use

permissions:
  nate.use:
    description: Permite interactuar con Nate por chat
    default: true
  nate.admin:
    description: Permite configurar API, modelo y moderación de Nate
    default: op
